[project]
name = "ecom-data-platform"
version = "0.1.0"
description = "Batch data platform for Olist product co-occurrence and inventory analytics"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
minio = ["minio>=7.2"]
spark = ["pyspark>=3.5"]
dev = ["ruff", "black", "pytest", "pytest-cov"]

[project.scripts]
ecom = "ecom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- tooling
[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "PTH",      # use pathlib
    "RET",      # return simplification
    "SIM",      # simplify
    "ARG",      # unused arguments
    "PD",       # pandas-vet
    "RUF",
]
ignore = [
    "PD010",  # .pivot_table is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
