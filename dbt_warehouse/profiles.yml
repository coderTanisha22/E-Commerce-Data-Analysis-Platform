# Profiles for the warehouse.
#
# Run dbt from this directory with --profiles-dir . so the local target works
# with no setup. The BigQuery target is the production one and needs
# `gcloud auth application-default login` plus a real project id.
ecom_dw:
  target: duckdb
  outputs:

    # Local target. Reads the pipeline's processed Parquet directly, so the
    # whole warehouse can be built and every test run with no cloud account.
    duckdb:
      type: duckdb
      path: "{{ env_var('ECOM_DBT_DUCKDB_PATH', '.duckdb/ecom_dw.duckdb') }}"
      schema: main
      threads: 4

    # Production target. Source tables are read from the dataset that
    # scripts/load_to_bigquery.py writes; models are built into `dataset`.
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('ECOM_GCP_PROJECT', 'YOUR_GCP_PROJECT') }}"
      dataset: olist_analytics_dev
      location: "{{ env_var('ECOM_GCP_LOCATION', 'US') }}"
      threads: 4
      timeout_seconds: 300
      priority: interactive
      retries: 1
