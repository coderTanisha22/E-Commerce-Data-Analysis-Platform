name: ecom_dw
version: "1.0.0"
config-version: 2
profile: ecom_dw
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Where the local DuckDB target reads the pipeline's output from. Relative to
  # this directory, which is where dbt is invoked. The BigQuery target ignores
  # both: it reads real tables from the `olist_cleaned` dataset.
  processed_dir: "../data/processed"
  raw_dir: "../data/raw/olist"

  # The observation window the pipeline uses everywhere else. Declared here so
  # the warehouse cannot silently disagree with src/ecom/config.py.
  window_start: "2017-02-01"
  window_end: "2018-08-31"

models:
  ecom_dw:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
