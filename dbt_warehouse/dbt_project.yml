name: ecom_dw
version: "1.0.0"
config-version: 2
profile: ecom_dw
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Where the local DuckDB target reads the pipeline's output from. Relative to
  # this directory, which is where dbt is invoked. The BigQuery target ignores
  # both: it reads real tables from the `olist_cleaned` dataset.
  processed_dir: "../data/processed"
  raw_dir: "../data/raw/olist"

  # The observation window the pipeline uses everywhere else. Declared here so
  # the warehouse cannot silently disagree with src/ecom/config.py.
  window_start: "2017-02-01"
  window_end: "2018-08-31"

models:
  ecom_dw:
    # On BigQuery staging and intermediate are views, the usual dbt layering:
    # they cost nothing to store and always reflect the source.
    #
    # On DuckDB they materialise as tables instead. The sources are read with
    # read_parquet() on a path relative to this directory, so a view would only
    # resolve while the querying process happened to share that working
    # directory. Materialising makes the .duckdb file self-contained and
    # queryable from anywhere, which is what makes it useful for ad-hoc work.
    staging:
      +materialized: "{{ 'table' if target.type == 'duckdb' else 'view' }}"
    intermediate:
      +materialized: "{{ 'table' if target.type == 'duckdb' else 'view' }}"
    marts:
      +materialized: table
